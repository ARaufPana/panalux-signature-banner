name: Regenerate Panalux banner

on:
  # Primary trigger: external cron-job.org POSTs daily to the workflow_dispatch
  # endpoint with a fine-grained PAT (scoped to Actions: Read/Write on this
  # repo only). GitHub Actions native `schedule:` was tried and proved
  # unreliable — runs dropped or delayed 4–6 hours — so removed entirely.
  workflow_dispatch: {}    # manual trigger from Actions tab + external API
  repository_dispatch:
    types: [daily-banner-trigger]

permissions:
  contents: write

concurrency:
  group: regenerate-banner
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions pinned to immutable commit SHAs (security
      # remediation R3) — version tags are mutable and could be repointed
      # at malicious code. Dependabot maintains these pins via weekly PRs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Arial (Microsoft Core Fonts) + Liberation fallback
        run: |
          sudo apt-get update -qq
          # ttf-mscorefonts-installer requires EULA acceptance — auto-accept it.
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            ttf-mscorefonts-installer fonts-liberation
          # Refresh font cache so Pillow can find them
          sudo fc-cache -f

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Regenerate banner
        run: python regenerate.py

      - name: Commit banner if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/panalux-latest.png cache/panalux-last-good.png
          if git diff --staged --quiet; then
            echo "Banner unchanged — nothing to commit"
          else
            git commit -m "chore: daily regeneration $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Upload banner as workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panalux-banner-${{ github.run_id }}
          path: cache/panalux-latest.png
          if-no-files-found: warn
          retention-days: 30
