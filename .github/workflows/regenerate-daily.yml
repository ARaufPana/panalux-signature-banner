name: Regenerate Panalux banner

on:
  schedule:
    # TEMPORARY: tight debug loop — three slots in the next 15 minutes from
    # 2026-05-15 08:19 UTC push. Revert to daily times once we've confirmed
    # whether GHA cron fires at all for this repo.
    - cron: "26 8 * * *"   # 08:26 UTC
    - cron: "29 8 * * *"   # 08:29 UTC
    - cron: "32 8 * * *"   # 08:32 UTC
  workflow_dispatch: {}    # allows manual triggering from the Actions tab
  repository_dispatch:
    # Allows an external cron service (e.g. cron-job.org) to trigger the
    # workflow via the GitHub REST API — the most reliable fix if even the
    # multi-slot schedule above continues to drop runs.
    types: [daily-banner-trigger]

permissions:
  contents: write

concurrency:
  group: regenerate-banner
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Arial (Microsoft Core Fonts) + Liberation fallback
        run: |
          sudo apt-get update -qq
          # ttf-mscorefonts-installer requires EULA acceptance — auto-accept it.
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            ttf-mscorefonts-installer fonts-liberation
          # Refresh font cache so Pillow can find them
          sudo fc-cache -f

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Regenerate banner
        run: python regenerate.py

      - name: Commit banner if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/panalux-latest.png cache/panalux-last-good.png
          if git diff --staged --quiet; then
            echo "Banner unchanged — nothing to commit"
          else
            git commit -m "chore: daily regeneration $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Upload banner as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panalux-banner-${{ github.run_id }}
          path: cache/panalux-latest.png
          if-no-files-found: warn
          retention-days: 30
