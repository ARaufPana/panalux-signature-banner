name: Regenerate Panalux banner

on:
  # Primary trigger: external cron-job.org POSTs daily to the workflow_dispatch
  # endpoint with a fine-grained PAT (scoped to Actions: Read/Write on this
  # repo only). GitHub Actions native `schedule:` was tried and proved
  # unreliable — runs dropped or delayed 4–6 hours — so removed entirely.
  workflow_dispatch:       # manual trigger from Actions tab + external API
    inputs:
      publish:
        description: "Commit the result to this repo (set false for a dry run on a branch)"
        type: boolean
        default: true
  repository_dispatch:
    types: [daily-banner-trigger]

permissions:
  contents: write

concurrency:
  group: regenerate-banner
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions pinned to immutable commit SHAs (security
      # remediation R3) — version tags are mutable and could be repointed
      # at malicious code. Dependabot maintains these pins via weekly PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # No system fonts needed: the banner is posters only (the headline is
      # live HTML in the signature), so nothing here depends on the runner's
      # apt catalogue — one less thing to break when ubuntu-latest moves on.
      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Keep a copy of the currently published banner
        run: cp cache/panalux-latest.png /tmp/published.png || true

      - name: Regenerate banner
        run: python regenerate.py

      # Log-only: pixel-compare the fresh render with the currently published
      # banner, so every run's log states whether the image actually changed
      # (PNG bytes can differ between encoder versions with identical pixels).
      - name: Pixel-compare with published banner (log only)
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          new, old = Path("cache/panalux-latest.png"), Path("/tmp/published.png")
          missing = [str(p) for p in (new, old) if not p.exists()]
          if missing:
              print("compare skipped, missing:", missing); raise SystemExit(0)
          a, b = Image.open(old).convert("RGBA"), Image.open(new).convert("RGBA")
          bbox = ImageChops.difference(a, b).getbbox() if a.size == b.size else "size differs"
          print(f"published {a.size} {old.stat().st_size} B | fresh {b.size} {new.stat().st_size} B "
                f"| pixel-identical: {bbox is None} | diff bbox: {bbox}")
          PY

      # Skipped when a manual run sets publish=false — lets a branch prove
      # itself end-to-end without committing a banner. cron-job.org dispatches
      # carry no inputs, so the default (true) applies to every production run.
      - name: Commit banner if changed
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/panalux-latest.png cache/panalux-last-good.png
          if git diff --staged --quiet; then
            echo "Banner unchanged — nothing to commit"
          else
            git commit -m "chore: daily regeneration $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Upload banner as workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: panalux-banner-${{ github.run_id }}
          path: cache/panalux-latest.png
          if-no-files-found: warn
          retention-days: 30
